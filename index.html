<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relmap: ER diagrams from schema files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --font:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#EDF0F3;--dot:#C3CBD4;--paper:#FFFFFF;--ink:#16202C;--muted:#5F6B7A;--faint:#98A1AD;--rule:#DCE1E7;
  --line:#8B96A3;--hot:#3550D9;--hot-soft:rgba(53,80,217,.12);--danger:#C23A3A;--panel:#F8F9FB;--chrome:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,45,.07),0 6px 16px rgba(20,30,45,.07);
  --hd:94%;--tl:30%;--hb:55%;--hs:62%;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141A;--dot:#252C36;--paper:#1A2029;--ink:#E5E9EF;--muted:#9AA4B1;--faint:#6A7482;--rule:#2A323D;
  --line:#5E6977;--hot:#8EA2FF;--hot-soft:rgba(142,162,255,.14);--danger:#F07171;--panel:#151A21;--chrome:#161B23;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--hd:20%;--tl:82%;--hb:58%;--hs:30%;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10141A;--dot:#252C36;--paper:#1A2029;--ink:#E5E9EF;--muted:#9AA4B1;--faint:#6A7482;--rule:#2A323D;
  --line:#5E6977;--hot:#8EA2FF;--hot-soft:rgba(142,162,255,.14);--danger:#F07171;--panel:#151A21;--chrome:#161B23;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--hd:20%;--tl:82%;--hb:58%;--hs:30%;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

/* toolbar */
#bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--chrome);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;position:relative;z-index:20}
#bar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em;padding-right:8px;margin-right:4px;border-right:1px solid var(--rule);white-space:nowrap}
.brand svg{flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border:1px solid transparent;background:transparent;border-radius:7px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hot-soft)}
.btn.on{background:var(--hot-soft);color:var(--hot)}
.btn.primary{background:var(--hot);color:var(--paper);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--rule)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn svg{width:17px;height:17px;flex:none}
.sep{width:1px;height:22px;background:var(--rule);flex:none;margin:0 4px}
.grow{flex:1;min-width:8px}
.search{position:relative;flex:none}
.search input{height:34px;width:280px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);padding:0 10px 0 32px}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--faint)}
#searchRes{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 34px rgba(10,20,30,.2);width:400px;max-width:calc(100vw - 16px);overflow:hidden}
.sr-tabs{display:flex;gap:4px;padding:8px 8px 7px;border-bottom:1px solid var(--rule)}
.sr-tab{border:0;background:none;padding:4px 11px;border-radius:99px;cursor:pointer;color:var(--muted);font-size:12.5px}
.sr-tab.on{background:var(--hot-soft);color:var(--hot);font-weight:600}
.sr-tab b{font-weight:500;color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.sr-tab.on b{color:inherit}
.sr-kind{margin-left:auto;align-self:center;font-size:11.5px;color:var(--faint)}
.sr-body{max-height:min(420px,58vh);overflow:auto;padding:4px}
.sr-grp{font-size:12px;color:var(--faint);padding:8px 8px 3px;display:flex}
.sr-grp button{margin-left:auto;border:0;background:none;color:var(--hot);cursor:pointer;font-size:12px;padding:0}
.sr-it{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer}
.sr-it.act,.sr-it:hover{background:var(--hot-soft)}
.sr-it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-it .sub{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-it .ty{font-size:12px;color:var(--faint);flex:none}
.sr-it .ic{color:var(--faint)}
mark{background:hsl(48 100% 58% / .5);color:inherit;border-radius:2px;padding:0}
.sr-foot{border-top:1px solid var(--rule);padding:7px 8px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.sr-foot .btn{height:28px;font-size:12.5px;padding:0 9px;margin-left:auto}
.sr-help{padding:12px 14px;font-size:12.5px;color:var(--muted);line-height:1.75}
.sr-help code{background:var(--hot-soft);padding:1px 6px;border-radius:4px;color:var(--ink);font-size:12px}
.sr-err{color:var(--danger)}
.row.match{background:hsl(48 100% 58% / .28)}
.row.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background:hsl(48 100% 58% / .7)}100%{background:transparent}}
.crow.flash{animation:flash 1.8s ease-out;border-radius:6px}
.chip{position:absolute;left:50%;top:14px;translate:-50% 0;background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:99px;padding:4px 5px 4px 14px;display:flex;gap:10px;align-items:center;font-size:13px;z-index:6;white-space:nowrap}
.chip .btn{height:26px;font-size:12.5px;padding:0 10px;border-radius:99px}
.rlab rect{fill:var(--paper);stroke:var(--hot);stroke-width:1.2}
.rlab.n rect{stroke:var(--line)}
.rlab text{font:650 11px var(--font);fill:var(--hot);text-anchor:middle;dominant-baseline:central}
.rlab.n text{fill:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:12px 0 10px}
.seg button{border:0;background:var(--paper);padding:9px 4px 8px;cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--hot-soft);color:var(--hot);font-weight:600}
.seg svg{width:54px;height:14px}
.cb{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--rule);color:var(--muted);font-variant-numeric:tabular-nums;flex:none;font-weight:600}
.menu{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--rule);border-radius:9px;box-shadow:0 10px 30px rgba(10,20,30,.18);padding:6px;min-width:250px}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.mi:hover,.mi.act{background:var(--hot-soft)}
.mi .chk{width:14px;color:var(--hot);font-weight:700}
.mi small{margin-left:auto;color:var(--faint)}
.mh{font-size:12px;color:var(--muted);padding:8px 10px 4px;font-weight:600}
.msep{height:1px;background:var(--rule);margin:5px 4px}

/* main */
#main{position:relative;display:grid;grid-template-columns:1fr auto;min-height:0}
#stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.3px)}
#stage.panning{cursor:grabbing}
#stage.linking,#stage.linking *{cursor:crosshair!important}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;overflow:visible;pointer-events:none}
#links .hit{pointer-events:stroke}
#tables{position:absolute;left:0;top:0}

/* tables */
.tbl{position:absolute;left:0;top:0;background:var(--paper);border-radius:8px;box-shadow:0 0 0 1px var(--rule),var(--shadow);user-select:none;-webkit-user-select:none;transition:opacity .25s,box-shadow .2s}
.th{height:42px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border-radius:8px 8px 0 0;background:hsl(var(--h) var(--hs) var(--hd));border-top:3px solid hsl(var(--h) 52% var(--hb));border-bottom:1px solid var(--rule);cursor:move}
.tbl.solo .th{border-radius:8px;border-bottom:0}
.tn{font-weight:650;font-size:15px;color:hsl(var(--h) 45% var(--tl));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows{padding:6px 0}
.row{height:28px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;position:relative;cursor:default}
.row:hover{background:var(--hot-soft)}
.ic{width:14px;height:14px;flex:none;color:var(--faint);display:grid;place-items:center}
.ic svg{width:13px;height:13px}
.row.pk .ic{color:hsl(var(--h) 50% 45%)}
.cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.pk .cn{font-weight:650}
.ct{color:var(--faint);font-size:12px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.row.jc{background:hsl(var(--h) 70% 55% / .14)}
.row.jc .cn{color:hsl(var(--h) 55% var(--tl));font-weight:650}
.row.drop{background:var(--hot-soft);box-shadow:inset 0 0 0 2px var(--hot)}
.port{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--paper);border:2px solid var(--hot);opacity:0;cursor:crosshair;transition:opacity .12s,transform .12s;z-index:2}
.port.l{left:-6px}.port.r{right:-6px}
.port:hover{transform:scale(1.35)}
.row:hover .port,#stage.linking .port{opacity:1}
@media (hover:none){.port{opacity:.75}}
.foot{height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);border-top:1px dashed var(--rule);cursor:pointer}
.foot:hover{color:var(--hot)}
.tbl.sel{box-shadow:0 0 0 2px var(--hot),0 10px 30px rgba(30,50,140,.18)}
.tbl.nb{box-shadow:0 0 0 1.5px hsl(var(--h) 55% 55%),var(--shadow)}
.tbl.dim{opacity:.18}
.tbl.gone{display:none}
.tbl.wave::after{content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none;animation:ring 1.1s cubic-bezier(.2,.7,.3,1) var(--d,0s) both}
@keyframes ring{0%{box-shadow:0 0 0 0 hsl(var(--h) 70% 55% / .7)}100%{box-shadow:0 0 0 26px hsl(var(--h) 70% 55% / 0)}}
.tbl.enter{animation:enter .45s cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
@keyframes enter{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
#stage.lod .rows,#stage.lod .foot{visibility:hidden}
#stage.lod .tn{font-size:22px}

/* links */
.rel .base{fill:none;stroke:var(--line);stroke-width:1.5;opacity:.6}
.rel .flow{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1.5 10.5;opacity:0}
.anim .rel .flow{opacity:1;animation:flow 1.15s linear infinite}
.anim.anim-sel .rel:not(.hot) .flow{opacity:0;animation:none}
.rev .rel .flow{animation-direction:reverse!important}
.rel .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.rel.hov .base{stroke:var(--hot);opacity:.85}
.rel.hot .base{stroke:var(--hot);stroke-width:2.2;opacity:1}
.rel.hot .flow{stroke:var(--paper);stroke-width:1.6;stroke-dasharray:5 9;opacity:.95}
.anim .rel.hot .flow{animation:flowH .8s linear infinite}
.rel.sel .base{stroke-width:3.4}
.rel.dim{opacity:.1}
.rel.gone{display:none}
.rel.partial .base{stroke-dasharray:6 4}
.pulse{fill:var(--hot);stroke:var(--paper);stroke-width:1.5}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes flowH{to{stroke-dashoffset:-14}}
#tmpLink{fill:none;stroke:var(--hot);stroke-width:2;stroke-dasharray:6 5;animation:flow .6s linear infinite}
.mk-n{stroke:var(--line);fill:none;stroke-width:1.5}
.mk-h{stroke:var(--hot);fill:none;stroke-width:2}

/* overlays */
.zoombox{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--chrome);border:1px solid var(--rule);border-radius:9px;padding:3px;box-shadow:var(--shadow);z-index:5}
.zoombox .lbl{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);cursor:pointer;border:0;background:none;height:30px;border-radius:6px}
.zoombox .lbl:hover{background:var(--hot-soft)}
.zoombox .btn{height:30px;width:30px}
#mini{position:absolute;right:12px;bottom:12px;width:180px;height:116px;opacity:.92;background:var(--chrome);border:1px solid var(--rule);border-radius:9px;box-shadow:var(--shadow);cursor:pointer;z-index:5}
.hint{position:absolute;left:50%;top:14px;translate:-50% 0;background:var(--ink);color:var(--paper);padding:7px 12px;border-radius:7px;font-size:13px;z-index:6;pointer-events:none;white-space:nowrap}
#empty{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
#empty .card{pointer-events:auto;text-align:center;max-width:440px;padding:34px 30px;border:2px dashed var(--line);border-radius:14px;background:color-mix(in srgb,var(--paper) 85%,transparent)}
#empty h2{margin:0 0 8px;font-size:22px;letter-spacing:-.01em}
#empty p{margin:0 0 20px;color:var(--muted);line-height:1.5}
#empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#drop{position:absolute;inset:10px;border:3px dashed var(--hot);border-radius:14px;background:var(--hot-soft);display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--hot);z-index:30;pointer-events:none}
#toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));translate:-50% 0;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80}
.toast{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:13.5px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast button{background:none;border:0;color:var(--paper);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
@keyframes tin{from{opacity:0;translate:0 8px}}

/* panel */
#panel{width:340px;background:var(--panel);border-left:1px solid var(--rule);overflow:auto;min-height:0;z-index:10}
.ps{padding:16px 18px;border-bottom:1px solid var(--rule)}
.ps:last-child{border-bottom:0}
.ps h3{margin:0 0 10px;font-size:13px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:8px}
.ps h3 .n{margin-left:auto;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.title-in{width:100%;font-size:19px;font-weight:650;letter-spacing:-.01em;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:-4px -6px 4px;background:transparent}
.title-in:hover,.title-in:focus{border-color:var(--rule);background:var(--paper)}
.meta{color:var(--muted);font-size:13px}
.swatch{width:12px;height:12px;border-radius:3px;flex:none;background:hsl(var(--h) 55% 58%)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.acts .btn{height:30px;font-size:13px;padding:0 10px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:9px;padding:7px 8px;margin:0 -8px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left;width:calc(100% + 16px)}
.li:hover{background:var(--hot-soft)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .cnt{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.li .x{opacity:0;border:0;background:none;color:var(--danger);cursor:pointer;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;flex:none}
.li:hover .x,.li .x:focus-visible{opacity:1}
.li .x:hover{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.grp{font-size:12px;color:var(--faint);margin:10px 0 2px}
.filter{width:100%;height:32px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);padding:0 10px;margin-bottom:8px}
.crow{display:grid;grid-template-columns:26px 1fr 104px 26px;gap:4px;align-items:center;margin-bottom:4px}
.crow input{height:30px;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 6px;min-width:0;font-size:13px}
.crow input:hover,.crow input:focus{border-color:var(--rule);background:var(--paper)}
.crow .t{color:var(--muted)}
.kbtn{width:26px;height:26px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--faint);display:grid;place-items:center}
.kbtn:hover{background:var(--hot-soft)}
.kbtn.on{color:hsl(var(--h) 55% 45%)}
.kbtn svg{width:14px;height:14px}
.jform{display:grid;gap:6px}
.jform select{height:32px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);padding:0 6px;min-width:0;width:100%}
.jform .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.legend{display:grid;gap:8px;font-size:13px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:10px}
.tips{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.6}
.badge{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:99px;background:var(--hot-soft);color:var(--hot);font-weight:600}
.joinline{font-size:15px;line-height:1.5;margin:4px 0 8px}
.joinline b{font-weight:650}

@media (max-width:760px){
  #panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:55%;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -10px 30px rgba(0,0,0,.15);border-radius:14px 14px 0 0}
  #mini{display:none}
  .search input{width:150px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){
  .anim .rel .flow,.anim .rel.hot .flow,#tmpLink{animation:none!important}
  .tbl.wave::after,.tbl.enter,.toast{animation:none!important}
  .pulse{display:none}
}
</style>
</head>
<body>
<header id="bar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="3" width="8" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="8" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8"/><path d="M10 6.5h3.5a2 2 0 0 1 2 2V14" stroke="#3550D9" stroke-width="1.8" stroke-linecap="round"/></svg>
    Relmap
  </div>
  <button class="btn" data-menu="file">File <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="btn" data-menu="view">View <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
  <span class="sep"></span>
  <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>

/* ================= link geometry ================= */
function relPath(r){
  const A=D.tById.get(r.from),B=D.tById.get(r.to);if(!A||!B)return "";

  if(A!==B&&A.x+ga.w+50<B.x){sa=1;sb=-1;}
  else if(A!==B&&B.x+gb.w+50<A.x){sa=-1;sb=1;}

  return pathBetween(anchor(A,r.fromCol,sa),sa,anchor(B,r.toCol,sb),sb);
}
function pathBetween(pa,sa,pb,sb){
  if(ui.line==="curve"){
    let k=Math.max(60,Math.abs(pb.x-pa.x)/2);if(sa===sb)k=Math.max(80,Math.abs(pb.x-pa.x)+60);
    return `M${pa.x},${pa.y} C${pa.x+sa*k},${pa.y} ${pb.x+sb*k},${pb.y} ${pb.x},${pb.y}`;
  }
  let pts;

  else{const X=sa>0?Math.max(pa.x,pb.x)+36:Math.min(pa.x,pb.x)-36;pts=[pa,{x:X,y:pa.y},{x:X,y:pb.y},pb];}

}
function rounded(pts,r){
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1],p=pts[i],p1=pts[i+1];
    const d0=Math.hypot(p.x-p0.x,p.y-p0.y),d1=Math.hypot(p1.x-p.x,p1.y-p.y);
    const rr=Math.min(r,d0/2,d1/2);
    if(rr<.5||d0<.5||d1<.5){d+=` L${p.x},${p.y}`;continue;}
    d+=` L${p.x+(p0.x-p.x)/d0*rr},${p.y+(p0.y-p.y)/d0*rr} Q${p.x},${p.y} ${p.x+(p1.x-p.x)/d1*rr},${p.y+(p1.y-p.y)/d1*rr}`;
  }
  const l=pts[pts.length-1];return d+` L${l.x},${l.y}`;

/* ================= auto layout ================= */
function autoLayout(){
  refresh();const T=S.tables,n=T.length;if(!n)return;
  const g=T.map(t=>geom(t)),idx=new Map(T.map((t,i)=>[t.id,i])),adj=T.map(()=>new Set());
  for(const r of S.rels){const a=idx.get(r.from),b=idx.get(r.to);if(a!=null&&b!=null&&a!==b){adj[a].add(b);adj[b].add(a);}}
  const seen=new Array(n).fill(false),comps=[];
  const byDeg=[...Array(n).keys()].sort((a,b)=>adj[b].size-adj[a].size);
  for(const s of byDeg){if(seen[s])continue;const comp=[],q=[s];seen[s]=true;
    while(q.length){const v=q.shift();comp.push(v);[...adj[v]].sort((a,b)=>adj[b].size-adj[a].size).forEach(u=>{if(!seen[u]){seen[u]=true;q.push(u);}});}
    comps.push(comp);}
  const X=new Float64Array(n),Y=new Float64Array(n);
  const placed=[];
  for(const comp of comps){
    if(comp.length===1){placed.push({nodes:comp,single:true});continue;}
    const m=comp.length,K=260;
    comp.forEach((v,i)=>{const a=i*2.39996,rr=K*.55*Math.sqrt(i+.5);X[v]=Math.cos(a)*rr;Y[v]=Math.sin(a)*rr;});
    const iters=Math.min(420,120+m*3);const dx=new Float64Array(n),dy=new Float64Array(n);
    for(let it=0;it<iters;it++){
      const temp=60*(1-it/iters)+2;
      for(const v of comp){dx[v]=0;dy[v]=0;}
      for(let i=0;i<m;i++){const a=comp[i],ra=(g[a].w+g[a].h)/4;
        for(let j=i+1;j<m;j++){const b=comp[j],rb=(g[b].w+g[b].h)/4;
          let ddx=X[a]-X[b],ddy=Y[a]-Y[b];let d=Math.hypot(ddx,ddy)||.01;
          const eff=Math.max(d-(ra+rb)*.6,8);const f=K*K/eff/d;
          dx[a]+=ddx*f;dy[a]+=ddy*f;dx[b]-=ddx*f;dy[b]-=ddy*f;}}
      for(const a of comp)for(const b of adj[a])if(a<b){let ddx=X[a]-X[b],ddy=Y[a]-Y[b];const d=Math.hypot(ddx,ddy)||.01;const f=d/K*1.1;dx[a]-=ddx*f;dy[a]-=ddy*f;dx[b]+=ddx*f;dy[b]+=ddy*f;}
      for(const v of comp){dx[v]-=X[v]*.012;dy[v]-=Y[v]*.012;const l=Math.hypot(dx[v],dy[v])||1;const s=Math.min(l,temp)/l;X[v]+=dx[v]*s;Y[v]+=dy[v]*s*.8;}
    }
    resolveOverlaps(comp,g,X,Y,56);
    placed.push({nodes:comp,single:false});
  }
  // pack components with shelf packing
  const boxes=[];
  for(const p of placed){
    if(p.single)continue;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const v of p.nodes){x0=Math.min(x0,X[v]-g[v].w/2);y0=Math.min(y0,Y[v]-g[v].h/2);x1=Math.max(x1,X[v]+g[v].w/2);y1=Math.max(y1,Y[v]+g[v].h/2);}
    boxes.push({nodes:p.nodes,x0,y0,w:x1-x0,h:y1-y0});
  }
  const singles=placed.filter(p=>p.single).map(p=>p.nodes[0]);
  const area=boxes.reduce((s,b)=>s+b.w*b.h,0)+singles.reduce((s,v)=>s+(g[v].w+60)*(g[v].h+60),0);
  const rowW=Math.max(1400,Math.sqrt(area)*1.5);const GAP=120;
  let cx=0,cy=0,rowH=0;
  boxes.sort((a,b)=>b.w*b.h-a.w*a.h);
  for(const b of boxes){if(cx>0&&cx+b.w>rowW){cx=0;cy+=rowH+GAP;rowH=0;}
    for(const v of b.nodes){T[v].x=Math.round(X[v]-g[v].w/2-b.x0+cx);T[v].y=Math.round(Y[v]-g[v].h/2-b.y0+cy);}
    cx+=b.w+GAP;rowH=Math.max(rowH,b.h);}
  if(singles.length){cx=0;cy+=rowH+(boxes.length?GAP*1.5:0);rowH=0;
    singles.sort((a,b)=>T[a].name.localeCompare(T[b].name));
    for(const v of singles){if(cx>0&&cx+g[v].w>rowW){cx=0;cy+=rowH+50;rowH=0;}T[v].x=cx;T[v].y=cy;cx+=g[v].w+50;rowH=Math.max(rowH,g[v].h);}}
}
function resolveOverlaps(nodes,g,X,Y,pad){
  for(let pass=0;pass<240;pass++){let moved=false;
    for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
      const ox=(g[a].w+g[b].w)/2+pad-Math.abs(X[a]-X[b]),oy=(g[a].h+g[b].h)/2+pad*.7-Math.abs(Y[a]-Y[b]);
      if(ox>0&&oy>0){moved=true;if(ox<oy){const s=(X[a]<X[b]?-1:1)*ox/2;X[a]+=s;X[b]-=s;}else{const s=(Y[a]<Y[b]?-1:1)*oy/2;Y[a]+=s;Y[b]-=s;}}}}
    if(!moved)break;}
}

const truthy=v=>/^(y|yes|true|1|pk|x|✓|✔|primary|primary key)$/i.test(String(v).trim());
function findIdx(h,re,not=[]){return h.findIndex((x,i)=>re.test(x)&&!not.includes(i));}
function parseWorkbook(wb){
  let colRows=null,colHead=null,relRows=null,relHead=null,layRows=null,layHead=null;
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",raw:false,blankrows:false});
    if(!rows.length)continue;const head=rows[0].map(x=>String(x).trim().toLowerCase());
    const hasFromTo=head.some(h=>/^from.*(table|view)/.test(h))&&head.some(h=>/^to.*(table|view)/.test(h));
    if(hasFromTo){relRows=rows.slice(1);relHead=head;continue;}
    if(head.includes("x")&&head.includes("y")&&head.some(h=>/table|view/.test(h))){layRows=rows.slice(1);layHead=head;continue;}
    if(!colRows&&rows.length>1){colRows=rows.slice(1);colHead=head;}
  }
  if(!colRows)throw new Error("No rows found. The first sheet needs a header row and one row per column.");
  const h=colHead;
  let ti=findIdx(h,/table|view|entity|object|relation/);
  let ci=findIdx(h,/column|field|attribute/,[ti]);
  const cdi=findIdx(h,/relationship|cardinality/,[ti,ci]);
  let di=findIdx(h,/data.?type|^type$/,[ti,ci,cdi]);if(di<0)di=findIdx(h,/type/,[ti,ci,cdi]);
  const refT=findIdx(h,/(ref|foreign|fk|references).*(table|view)/,[ti,ci,di]);
  const refC=findIdx(h,/(ref|foreign|fk|references).*(col|field)/,[ti,ci,di,refT]);
  const pki=findIdx(h,/primary|^pk$|^is.?pk|^key$|is.?key/,[ti,ci,di,refT,refC]);
  if(ti<0)ti=0;if(ci<0)ci=ti===0?1:0;if(di<0)di=[0,1,2].find(i=>i!==ti&&i!==ci);
  const map=new Map(),refs=[];
  for(const row of colRows){
    const tn=String(row[ti]??"").trim(),cn=String(row[ci]??"").trim();if(!tn||!cn)continue;
    if(!map.has(tn))map.set(tn,makeTable(tn,[]));
    const t=map.get(tn);const col={id:uid("c"),name:cn,type:String(row[di]??"").trim()||"text"};
    if(pki>=0&&String(row[pki]).trim()!=="")col.pk=truthy(row[pki]);
    t.columns.push(col);
    if(refT>=0&&String(row[refT]).trim())refs.push([tn,cn,String(row[refT]).trim(),refC>=0?String(row[refC]).trim():"",cdi>=0?parseCard(row[cdi]):"1:N"]);
  }
  const tables=[...map.values()];
  const byName=new Map(tables.map(t=>[t.name.toLowerCase(),t]));
  const colBy=(t,n)=>t&&t.columns.find(c=>c.name.toLowerCase()===String(n).toLowerCase());
  let rels=null;
  const addRel=(ft,fc,tt,tc,src,card)=>{const A=byName.get(ft.toLowerCase()),B=byName.get(String(tt).toLowerCase());if(!A||!B)return;
    const a=colBy(A,fc);let b=tc?colBy(B,tc):null;if(!b){const pk=findPK(B);b=pk||B.columns[0];}if(!a||!b)return;
    rels.push({id:uid("r"),from:A.id,fromCol:a.id,to:B.id,toCol:b.id,source:src,card:card||"1:N"});};
  if(relRows){rels=[];const rh=relHead;const f=findIdx(rh,/^from.*(table|view)/),fc=findIdx(rh,/^from.*(col|field)/),t=findIdx(rh,/^to.*(table|view)/),tc=findIdx(rh,/^to.*(col|field)/),src=findIdx(rh,/source|origin/),cd=findIdx(rh,/relationship|cardinality|^type$/);
    for(const r of relRows){if(!r[f]||!r[t])continue;addRel(String(r[f]),String(r[fc]),String(r[t]),tc>=0?String(r[tc]):"",src>=0&&/manual/i.test(r[src])?"manual":"file",cd>=0?parseCard(r[cd]):"1:N");}}
  if(refs.length){rels=rels||[];for(const [a,b,c,d,e] of refs)addRel(a,b,c,d,"file",e);}
  let laid=false;
  if(layRows){const li=findIdx(layHead,/table|view/),xi=layHead.indexOf("x"),yi=layHead.indexOf("y");
    for(const r of layRows){const t=byName.get(String(r[li]).toLowerCase());if(t&&r[xi]!==""&&r[yi]!==""){t.x=+r[xi];t.y=+r[yi];laid=true;}}}
  return{tables,rels,laid};
}
async function importFile(file){
  try{
    const name=file.name.replace(/\.[^.]+$/,"");
    if(/\.json$/i.test(file.name)){const o=JSON.parse(await file.text());if(!o.tables)throw new Error("This JSON isn’t a Relmap project.");
      loadModel(o.tables,o.rels||[],o.name||name,{keepPositions:true,display:o.display});return;}
    if(typeof XLSX==="undefined")throw new Error("The spreadsheet reader didn’t load. Check your connection and reload.");
    const buf=await file.arrayBuffer();
    const wb=/\.(csv|tsv|txt)$/i.test(file.name)?XLSX.read(new TextDecoder().decode(buf),{type:"string",raw:true}):XLSX.read(buf,{type:"array"});
    const {tables,rels,laid}=parseWorkbook(wb);
    if(!tables.length)throw new Error("No tables found. Check that the file has table and column names.");
    loadModel(tables,rels,name,{keepPositions:laid});
  }catch(err){toast(err.message||"That file couldn’t be read.");}
}

addEventListener("drop",e=>{e.preventDefault();dragDepth=0;$("#drop").hidden=true;const f=e.dataTransfer.files[0];if(f)importFile(f);});

async function saveFile(name,data,mime){
  try{if(window.claude&&typeof window.claude.use==="function"){const dl=await window.claude.use("downloads");
      if(dl){try{await dl.save({filename:name,data:new Blob([data],{type:mime})});toast("Saved "+name);}catch(e){if(e&&e.code!=="declined")toast("Couldn’t save the file here.");}return;}}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
const fname=ext=>(S.name||"schema").replace(/[^\w\-]+/g,"_")+"_er."+ext;
function columnRows(withRefs){
  const out=[["View Name","Column Name","Data Type","Is Primary Key"].concat(withRefs?["References Table","References Column","Relationship"]:[])];
  const refBy=new Map();for(const r of S.rels)if(!refBy.has(r.fromCol))refBy.set(r.fromCol,r);
  for(const t of S.tables){const pk=D.pk.get(t.id);for(const c of t.columns){const row=[t.name,c.name,c.type,c.id===pk?"Yes":""];
    if(withRefs){const r=refBy.get(c.id);row.push(r?D.tById.get(r.to).name:"",r?colOf(r.to,r.toCol).name:"",r?CARDS[cardOf(r)].name:"");}out.push(row);}}
  return out;
}
function exportXLSX(){

  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rr),"Relationships");

}

function addTable(){
  snapshot();const r=stage.getBoundingClientRect();
  let n=1;while(S.tables.some(t=>t.name==="new_table"+(n>1?"_"+n:"")))n++;
  const t=makeTable("new_table"+(n>1?"_"+n:""),[{name:"id",type:"bigint",pk:true}]);
  const cx=(r.width/2-view.x)/view.k-110,cy=(r.height/2-view.y)/view.k-60;
  const free=(x,y)=>S.tables.every(o=>{const g=geom(o);return x+260<o.x||x>o.x+g.w+40||y+140<o.y||y>o.y+g.h+40;});
  let px=cx,py=cy;for(let i=0;i<400&&!free(px,py);i++){const a=i*.9,rr=30+i*14;px=cx+Math.cos(a)*rr;py=cy+Math.sin(a)*rr;}
  t.x=Math.round(px);t.y=Math.round(py);
  S.tables.push(t);ui.sel=t.id;ui.selRel=null;ui.panel=true;syncPanelBtn();render({wave:true});
  setTimeout(()=>{const i=panel.querySelector(".title-in");if(i){i.focus();i.select();}},30);
}
function deleteTable(id){const t=D.tById.get(id);if(!t)return;snapshot();S.tables=S.tables.filter(x=>x.id!==id);if(ui.sel===id)ui.sel=null;render();toast(`Removed ${t.name}`,true);}
function addRel(from,fromCol,to,toCol,source="manual",card="1:N"){
  if(S.rels.some(r=>r.fromCol===fromCol&&r.toCol===toCol)){toast("These columns are already joined");return null;}
  if(fromCol===toCol){return null;}
  snapshot();const r={id:uid("r"),from,fromCol,to,toCol,source,card};S.rels.push(r);
  render({keepPanel:true});applyClasses(false);
  const g=relEls.get(r.id);if(g&&!reduced)drawOn(g.children[1],0);
  renderPanel();
  toast(`Joined ${D.tById.get(from).name}.${colOf(from,fromCol).name} → ${D.tById.get(to).name}.${colOf(to,toCol).name} (${CARDS[card].name.toLowerCase()})`);
  return r;
}
function deleteRel(id){if(!D.rById.has(id))return;snapshot();S.rels=S.rels.filter(r=>r.id!==id);if(ui.selRel===id)ui.selRel=null;render();toast("Join removed",true);}
function setCard(id,c){const r=D.rById.get(id);if(!r||cardOf(r)===c)return;snapshot();r.card=c;render();applyClasses(true);toast(`Changed to ${CARDS[c].name.toLowerCase()}`,true);}
function flipRel(id){const r=D.rById.get(id);if(!r)return;snapshot();[r.from,r.to]=[r.to,r.from];[r.fromCol,r.toCol]=[r.toCol,r.fromCol];r.source="manual";render({wave:true});}
function detectJoins(){
  if(!S.tables.length)return;snapshot();refresh();
  const keep=S.rels.filter(r=>r.source==="manual"||r.source==="file");
  const found=inferRelationships(S.tables).filter(n=>!keep.some(k=>k.fromCol===n.fromCol&&k.toCol===n.toCol));
  const before=S.rels.length;S.rels=keep.concat(found);render();
  for(const g of relEls.values())drawOn(g.children[1],Math.random()*400);
  toast(`${found.length} joins detected${keep.length?`, ${keep.length} manual joins kept`:""}`,before!==S.rels.length||true);
}

  if(re)return {kind,fn:s=>{const m=re.exec(s);if(!m)return null;const a=m.index,b=a+m[0].length;
    let ranges=b>a?[[a,b]]:[];
    if(kind==="wildcard"){ranges=[];let pos=0;for(const part of q.split(/[*?]+/).filter(Boolean)){const i=s.toLowerCase().indexOf(part.toLowerCase(),pos);if(i<0)break;ranges.push([i,i+part.length]);pos=i+part.length;}}
    return {score:70-Math.min(20,s.length*.3),ranges};}};
  const ql=q.toLowerCase(),qn=ql.replace(/[\s_\-.]+/g,"");
  return {kind,fn:s=>{
    const sl=s.toLowerCase();const i=sl.indexOf(ql);
    if(i>=0){const sc=(sl===ql?100:i===0?92:isBoundary(s,i)?84:74)-Math.min(10,(s.length-ql.length)*.15);return {score:sc,ranges:[[i,i+ql.length]]};}
    if(!qn.length)return null;
    const map=[];let sn="";for(let k=0;k<s.length;k++)if(!/[\s_\-.]/.test(s[k])){map.push(k);sn+=sl[k];}
    const j=sn.indexOf(qn);if(j>=0)return {score:66-Math.min(10,(sn.length-qn.length)*.15),ranges:mergeIdx(map.slice(j,j+qn.length))};
    if(qn.length<2)return null;
    let pos=0,pts=0,prev=-2;const idxs=[];
    for(const ch of qn){let f=-1;for(let k=pos;k<sn.length;k++)if(sn[k]===ch){f=k;break;}
      if(f<0)return null;const cons=f===prev+1,bd=isBoundary(s,map[f]);if(!cons&&!bd){let g=-1;for(let k=pos;k<sn.length;k++)if(sn[k]===ch&&isBoundary(s,map[k])){g=k;break;}if(g<0)return null;f=g;}pts+=f===prev+1?3:2;idxs.push(map[f]);prev=f;pos=f+1;}
    const q2=pts/(qn.length*3);if(q2<.4)return null;
    return {score:20+q2*30-Math.min(10,(idxs[idxs.length-1]-idxs[0]+1-qn.length)*.3),ranges:mergeIdx(idxs)};
  }};
}
const sIn=$("#search"),sRes=$("#searchRes");
let sTab="all",sItems=[],sIdx=0,sLast={tables:[],cols:[]};
function placeSearch(){const r=sIn.getBoundingClientRect();sRes.style.top=(r.bottom+6)+"px";sRes.style.left=Math.max(8,Math.min(r.right-400,innerWidth-408))+"px";}
function runSearch(){
  placeSearch();const m=makeMatcher(sIn.value);sRes.hidden=false;
  if(!m){sItems=[];sRes.innerHTML=`<div class="sr-help">Type part of a table or column name. Patterns work too:<br><code>order</code> anywhere in the name<br><code>ordid</code> loose letters, matches OrderId<br><code>*_id</code> or <code>vw_Order?</code> wildcards<br><code>/^is[A-Z]/</code> a regular expression</div>`;return;}
  if(m.error){sItems=[];sRes.innerHTML=`<div class="sr-help sr-err">${m.error}</div>`;return;}
  const tables=[],cols=[];
  for(const t of S.tables){const r=m.fn(t.name);if(r)tables.push({k:"t",t,r});for(const c of t.columns){const rc=m.fn(c.name);if(rc)cols.push({k:"c",t,c,r:rc});}}
  const by=(a,b)=>b.r.score-a.r.score||(a.c||a.t).name.length-(b.c||b.t).name.length||a.t.name.localeCompare(b.t.name);
  tables.sort(by);cols.sort(by);sLast={tables,cols};
  const distinct=new Set(cols.map(x=>x.c.name.toLowerCase())).size;
  let groups=[];
  if(sTab==="all")groups=[["Tables",tables,6,"tables"],["Columns",cols,20,"columns"]];
  else if(sTab==="tables")groups=[["Tables",tables,300]];
  else groups=[["Columns",cols,300]];
  sItems=[];let html="";
  for(const [label,list,lim,tab] of groups){if(!list.length)continue;
    html+=`<div class="sr-grp">${label}${list.length>lim&&tab?`<button data-tab="${tab}">See all ${list.length}</button>`:""}</div>`;
    for(const it of list.slice(0,lim)){const i=sItems.length;sItems.push(it);
      if(it.k==="t"){const n=D.relsByT.get(it.t.id).length;html+=`<button class="sr-it" data-i="${i}" style="--h:${hueOf(it.t)}"><span class="swatch"></span><span class="nm">${hl(it.t.name,it.r.ranges)}<span class="sub">${it.t.columns.length} columns, ${n} join${n===1?"":"s"}</span></span></button>`;}
      else{const pk=D.pk.get(it.t.id)===it.c.id,fk=D.fkCols.has(it.c.id);html+=`<button class="sr-it" data-i="${i}" style="--h:${hueOf(it.t)}"><span class="ic">${pk?ICON_KEY:fk?ICON_FK:""}</span><span class="nm">${hl(it.c.name,it.r.ranges)}<span class="sub">in ${esc(it.t.name)}</span></span><span class="ty">${esc(abbr(it.c.type))}</span></button>`;}}}
  if(!sItems.length)html=`<div class="sr-help">Nothing matches “${esc(sIn.value.trim())}”. Try fewer letters or a wildcard like <code>*${esc(sIn.value.trim().slice(0,4))}*</code>.</div>`;
  const tset=new Set([...tables,...cols].map(x=>x.t.id));
  const kindLbl={text:"",wildcard:"wildcard",regex:"regular expression"}[m.kind];
  sRes.innerHTML=`<div class="sr-tabs">${[["all","All",tables.length+cols.length],["tables","Tables",tables.length],["columns","Columns",cols.length]].map(([k,l,n])=>`<button class="sr-tab${sTab===k?" on":""}" data-tab="${k}">${l}<b>${n}</b></button>`).join("")}${kindLbl?`<span class="sr-kind">${kindLbl}</span>`:""}</div>
    <div class="sr-body">${html}</div>
    ${tset.size?`<div class="sr-foot">${cols.length?`${distinct} distinct column name${distinct===1?"":"s"} in `:""}${tset.size} table${tset.size===1?"":"s"}<button class="btn ghost" data-hl="1">Highlight on canvas</button></div>`:""}`;
  sIdx=0;markAct();
}
function markAct(){sRes.querySelectorAll(".sr-it").forEach(b=>b.classList.toggle("act",+b.dataset.i===sIdx));const a=sRes.querySelector(".sr-it.act");if(a)a.scrollIntoView({block:"nearest"});}
function pickItem(it){sRes.hidden=true;sIn.blur();if(it.k==="t")selectTable(it.t.id,{zoom:true});else focusColumn(it.t.id,it.c.id);}
function highlightMatches(){
  const {tables,cols}=sLast;ui.match={q:sIn.value.trim(),tables:new Set([...tables,...cols].map(x=>x.t.id)),cols:new Set(cols.map(x=>x.c.id))};
  ui.sel=null;ui.selRel=null;sRes.hidden=true;sIn.blur();render({wave:true});
  const ids=[...ui.match.tables];if(ids.length)animateView(viewFor(boundsOf(ids),1));
}
function syncChip(){const c=$("#matchChip");const on=!!ui.match&&!ui.sel&&!ui.selRel;c.hidden=!on;
  if(on)c.innerHTML=`<span>${ui.match.tables.size} table${ui.match.tables.size===1?"":"s"} match “${esc(ui.match.q)}”</span><button class="btn ghost" data-clear="1">Clear</button>`;}
$("#matchChip").addEventListener("pointerdown",e=>e.stopPropagation());
$("#matchChip").addEventListener("click",e=>{if(e.target.closest("[data-clear]")){ui.match=null;render();}});
function focusColumn(tid,cid){
  const t=D.tById.get(tid);if(!t)return;
  if(!geom(t).idx.has(cid))ui.expanded.add(tid);
  ui.sel=tid;ui.selRel=null;ui.panel=true;render({wave:true});
  const a=anchor(t,cid,1),g=geom(t),rc=stage.getBoundingClientRect(),k=clamp(Math.max(view.k,.9),.05,1.1);
  animateView({k,x:rc.width/2-(a.x-g.w/2)*k,y:rc.height/2-a.y*k});
  const row=tablesEl.querySelector(`.tbl[data-t="${tid}"] .row[data-col="${cid}"]`);if(row){row.classList.add("flash");setTimeout(()=>row.classList.remove("flash"),1900);}
  const cr=panel.querySelector(`.crow[data-col="${cid}"]`);if(cr){cr.scrollIntoView({block:"center"});cr.classList.add("flash");}
}
sIn.addEventListener("input",()=>{sTab=sTab;runSearch();});
sIn.addEventListener("focus",runSearch);
sIn.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!sItems.length)return;sIdx=(sIdx+(e.key==="ArrowDown"?1:-1)+sItems.length)%sItems.length;markAct();}
  else if(e.key==="Enter"){e.preventDefault();if(e.ctrlKey||e.metaKey||e.shiftKey){if(sItems.length)highlightMatches();}else if(sItems[sIdx])pickItem(sItems[sIdx]);}
  else if(e.key==="Escape"){sRes.hidden=true;sIn.blur();}
});
sRes.addEventListener("pointerdown",e=>e.preventDefault());
sRes.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb){sTab=tb.dataset.tab;runSearch();return;}
  if(e.target.closest("[data-hl]")){highlightMatches();return;}
  const b=e.target.closest(".sr-it");if(b)pickItem(sItems[+b.dataset.i]);
});
addEventListener("resize",()=>{if(!sRes.hidden)placeSearch();});

addEventListener("keydown",e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==="z"&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&e.key.toLowerCase()==="y"&&!typing){e.preventDefault();redo();return;}
  if(mod&&e.key.toLowerCase()==="o"){e.preventDefault();$("#fileIn").click();return;}
  if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();sIn.focus();sIn.select();return;}
  if(typing)return;
  if(e.key==="Escape"){closeMenus();clearSel();}
  else if(e.key==="Delete"||e.key==="Backspace"){if(ui.selRel)deleteRel(ui.selRel);else if(ui.sel)deleteTable(ui.sel);}
  else if(e.key==="f"||e.key==="F")fit();
  else if(e.key==="+"||e.key==="=")zoomCenter(1.2);
  else if(e.key==="-"||e.key==="_")zoomCenter(1/1.2);
});
addEventListener("resize",()=>scheduleMini());

/* ================= boot ================= */
function boot(){
  const had=loadSaved();applyTheme();syncPanelBtn();
  if(had&&S.tables.length){render();applyView();}
  else if(USER_DATA)loadUserSample();
  else{render();applyView();}
  applyView();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{D.geo.clear();render({keepPanel:true});applyClasses(false);});
}
boot();
})();
</script>
